<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>かわいこちゃん 動き付きAR</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#eefaf8;color:#17343a}.app{max-width:900px;margin:auto;padding:14px}h1{font-size:clamp(1.25rem,5vw,1.8rem);text-align:center;margin:8px}.viewer{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 14px 45px #0a596426;background:#dff5f2}model-viewer{width:100%;height:min(78svh,720px);min-height:520px;background:radial-gradient(circle at 50% 30%,#fff,#dcf5f2);--poster-color:transparent}.motions{position:absolute;z-index:5;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:7px;width:min(94%,600px);padding:8px;border-radius:18px;background:#ffffffdf;backdrop-filter:blur(10px);box-shadow:0 8px 28px #0003}.motions button,.ar{border:0;border-radius:999px;min-height:42px;padding:8px 14px;font-weight:800;cursor:pointer}.motions button{background:#e0f5f2;color:#066873}.motions button:hover{background:#c7ebe7}.motions button:disabled{opacity:.5}.ar{position:absolute;z-index:6;right:15px;top:15px;background:#2563eb;color:#fff;box-shadow:0 7px 18px #2563eb55}.status{position:absolute;z-index:6;left:15px;top:15px;border-radius:999px;padding:8px 11px;background:#ffffffdf;font-size:.78rem;font-weight:800}.note{padding:14px 4px;line-height:1.7;color:#536b70;font-size:.86rem}@media(max-width:520px){.motions button{font-size:.72rem;padding:7px 10px}.ar{top:auto;bottom:86px}}
</style></head><body><main class="app"><h1>かわいこちゃん 動き付きAR</h1><section class="viewer"><div class="status" id="status">読み込み中…</div>
<model-viewer id="model" src="Kawaikochan_03_simple_animated.glb" ios-src="Kawaikochan_02_mate.usdz" alt="かわいこちゃんの3Dモデル" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto" camera-controls touch-action="pan-y" shadow-intensity=".8" environment-image="neutral" camera-orbit="0deg 75deg 15m" camera-target="0m .45m 0m">
<button slot="ar-button" class="ar">ARで見る</button>
<div class="motions"><button data-motion="Bounce">ぴょん！</button><button data-motion="Turn">きょろきょろ</button><button data-motion="Happy">うれしい！</button><button data-motion="HatAction">帽子</button></div>
</model-viewer></section><p class="note">モデル全体と帽子パーツを使った簡易アニメーション版です。手足を曲げる動作には、別途ボーンとウェイト設定が必要です。</p></main>
<script>
const m=document.querySelector('#model'),status=document.querySelector('#status'),buttons=[...document.querySelectorAll('[data-motion]')];let timer;
function idle(){if(m.availableAnimations.includes('Idle')){m.animationName='Idle';m.currentTime=0;m.play()}}
m.addEventListener('load',()=>{status.textContent='動きを選んでね';idle()});
m.addEventListener('error',()=>status.textContent='モデルを読み込めません');
buttons.forEach(b=>b.addEventListener('click',()=>{clearTimeout(timer);m.pause();m.animationName=b.dataset.motion;m.currentTime=0;m.play({repetitions:1});buttons.forEach(x=>x.disabled=true)}));
m.addEventListener('finished',()=>{buttons.forEach(x=>x.disabled=false);timer=setTimeout(idle,180)});
m.addEventListener('ar-status',e=>{if(e.detail.status==='session-started'&&m.availableAnimations.includes('Happy')){m.animationName='Happy';m.currentTime=0;m.play({repetitions:1})}});
</script></body></html>
